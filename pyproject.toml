[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "federal-reserve-policy-intelligence"
version = "0.1.0"
description = "Reliable NLP and market-reaction analysis for Federal Reserve communications"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas>=2.2,<3",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<9",
    "pytest-cov>=5,<8",
    "ruff>=0.9,<1",
]
nlp = [
    "scikit-learn>=1.5,<2",
    # PyTorch 2.9+ currently fails to initialize c10.dll on the tested Windows host.
    "torch>=2.8,<2.9",
    "transformers>=4.46,<5",
]
topic-comparison = [
    "bertopic>=0.17,<1",
    "umap-learn>=0.5,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

